<!DOCTYPE html>
<html lang="vi" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHUM QR Generator</title>
    <meta name="description" content="Tạo mã QR thanh toán VietQR chuẩn NAPAS. Quét được mọi app ngân hàng.">
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💳</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content header-centered">
            <div class="logo">
                <span class="logo-icon">💳</span>
                <h1>CHUM QR</h1>
            </div>
            <div class="header-actions">
                <a href="https://github.com/Chumvn/chumqr" target="_blank" class="github-link" title="GitHub">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" />
                    </svg>
                </a>
                <button class="theme-toggle" id="themeToggle" title="Chuyển đổi giao diện">
                    <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-container">
        <!-- Input Form Card -->
        <section class="card form-card">
            <h2 class="card-title">Thông tin chuyển khoản</h2>

            <div class="form-group">
                <label for="bankSearch">Ngân hàng</label>
                <div class="search-select-wrapper">
                    <input type="text" id="bankSearch" class="input-field" placeholder="Nhập tên ngân hàng để tìm..."
                        autocomplete="off">
                    <button type="button" id="clearBank" class="btn-clear" title="Xóa" style="display: none;">✕</button>
                    <input type="hidden" id="bankBin" value="">
                    <div class="search-dropdown" id="bankDropdown"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="accountNumber">Số tài khoản</label>
                <input type="text" id="accountNumber" class="input-field" placeholder="Nhập số tài khoản"
                    autocomplete="off">
            </div>

            <div class="form-group">
                <label for="accountName">Tên chủ tài khoản</label>
                <input type="text" id="accountName" class="input-field" placeholder="Nhập tên chủ tài khoản"
                    autocomplete="off">
            </div>

            <div class="form-group">
                <label for="amount">Số tiền (VND) - Tùy chọn</label>
                <input type="text" id="amount" class="input-field" placeholder="0" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="memo">Nội dung chuyển khoản - Tùy chọn</label>
                <input type="text" id="memo" class="input-field" placeholder="Nội dung" autocomplete="off">
            </div>

            <!-- Glassmorphism Toggle -->
            <div class="form-group toggle-group">
                <label>Hiệu ứng Glassmorphism</label>
                <div class="toggle-wrapper">
                    <span class="toggle-label">Tắt</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="glassToggle">
                        <span class="toggle-slider"></span>
                    </label>
                    <span class="toggle-label active">Bật</span>
                </div>
            </div>

            <button id="generateBtn" class="btn btn-primary">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <rect x="7" y="7" width="3" height="3"></rect>
                    <rect x="14" y="7" width="3" height="3"></rect>
                    <rect x="7" y="14" width="3" height="3"></rect>
                </svg>
                Tạo mã VietQR
            </button>
        </section>

        <!-- QR Preview & Export -->
        <section class="card preview-card" id="previewCard">
            <h2 class="card-title">Mã VietQR của bạn</h2>
            <p class="preview-hint">👆 Nhấn vào ảnh để lưu về máy</p>

            <div class="qr-container" id="qrContainer">
                <div id="loadingIndicator" class="loading-indicator" style="display: none;">
                    <div class="spinner"></div>
                    <span>Đang tạo mã QR...</span>
                </div>
                <!-- Glassmorphism wrapper -->
                <div id="glassWrapper" class="glass-wrapper">
                    <img id="qrImage" class="qr-image" alt="VietQR Code" style="display: none;" crossorigin="anonymous">
                </div>
            </div>

            <!-- Account Info Display -->
            <div class="account-info">
                <div class="info-row">
                    <span class="info-label">Chủ TK:</span>
                    <span class="info-value" id="infoAccountName">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Số TK:</span>
                    <span class="info-value info-highlight" id="infoAccountNumber">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Ngân hàng:</span>
                    <span class="info-value" id="infoBankName">-</span>
                </div>
                <div class="info-row" id="amountRow" style="display: none;">
                    <span class="info-label">Số tiền:</span>
                    <span class="info-value info-amount" id="infoAmount">-</span>
                </div>
            </div>

            <div class="export-actions">
                <button id="downloadBtn" class="btn btn-secondary">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Lưu ảnh PNG
                </button>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>Designed & built by <strong>CHUM / GIANG PRO</strong></p>
        <p class="footer-note">VietQR chuẩn NAPAS 247 · Quét được mọi app ngân hàng</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
